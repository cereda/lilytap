[versions]
kotlin = "2.4.21"
clikt = "5.1.0"
detekt = "1.23.8"
shadow = "9.6.1"
spotless = "8.10.4"
spotless-changelog = "3.1.2"
tapmoc = "0.5.0"
versions = "0.66.0"
jline = "4.4.8"
kover = "0.9.11"

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
spotless-changelog = { id = "com.diffplug.spotless-changelog", version.ref = "spotless-changelog" }
tapmoc = { id = "com.gradleup.tapmoc", version.ref = "tapmoc" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
versions = { id = "io.github.ben-manes.versions", version.ref = "versions" }

[libraries]
clikt = { group = "com.github.ajalt.clikt", name = "clikt", version.ref = "clikt" }
jline = { group = "org.jline", name = "jline", version.ref = "jline" }
